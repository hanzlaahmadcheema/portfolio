<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#070A11"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#0EA5E9" stroke-width="8" stroke-opacity="0.35"/>

  <!-- Top Window Status Dots -->
  <circle cx="116" cy="96" r="16" fill="#EF4444" opacity="0.85"/>
  <circle cx="164" cy="96" r="16" fill="#F59E0B" opacity="0.85"/>
  <circle cx="212" cy="96" r="16" fill="#10B981" opacity="0.85"/>

  <!-- Terminal Prompt > -->
  <path d="M128 180 L252 276 L128 372" stroke="url(#cyanGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Monospace Cursor _ -->
  <line x1="288" y1="372" x2="396" y2="372" stroke="url(#emeraldGrad)" stroke-width="48" stroke-linecap="round"/>
</svg>
